name: Rental Bot

on:
  schedule:
    # РЕЗЕРВ, раз в сутки. Основной поиск теперь идёт на домашнем ПК
    # (rental_daemon.py) — там Property24 открывается напрямую, без ScraperAPI.
    #
    # Почему раз в сутки, а не раз в 4 часа: бесплатный тариф ScraperAPI — это
    # ~1000 запросов/мес, а один прогон съедает ~15-20 (страницы поиска плюс по
    # запросу на каждое новое объявление). Шесть прогонов в день = ~3000/мес,
    # и кредиты кончались за неделю; после этого Property24 молча отваливался,
    # хотя прогоны оставались «успешными». Один прогон в сутки = ~500/мес и
    # укладывается в бесплатный лимит.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  check-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
        run: python bot.py

      - name: Save seen listings
        run: |
          git config user.name "rental-bot"
          git config user.email "rental-bot@users.noreply.github.com"
          git add seen_listings.json
          if ! git diff --staged --quiet; then
            git commit -m "Update seen listings"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi
